<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Golden ID demo</title><link rel="stylesheet" href="/styles.css"></head><body><header><a class="brand" href="/"><span>◆</span> Golden ID</a><span class="badge">Prototype • Not a government service</span></header><main><section class="hero"><p class="eyebrow">HOLDER-CONTROLLED ACCESS</p><h1>Retrieve a <em>demo card.</em></h1><p class="lead">Both the Golden ID and its private holder token are required. Production access should use OAuth, signed consent receipts and expiring scopes.</p></section><section class="panel"><form id="lookup"><label>Golden ID<input id="id" required placeholder="GID-..."></label><br><label>Holder token<input id="token" required></label><button class="primary">Retrieve card</button></form><div id="result"></div></section></main><script>const q=new URLSearchParams(location.search);document.querySelector('#id').value=q.get('id')||'';document.querySelector('#lookup').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/v1/cards/'+encodeURIComponent(document.querySelector('#id').value),{headers:{authorization:'Bearer '+document.querySelector('#token').value}});const d=await r.json();document.querySelector('#result').innerHTML=r.ok?`<div class="card"><small>GOLDEN ID • ${d.status}</small><h2>${d.name}</h2><p>${d.dob} · ${d.gender}</p><p class="gid">${d.id}</p></div>`:`<div class="error">${d.error}</div>`}</script></body></html>
